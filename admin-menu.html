<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Menu — Kettle & Ash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav class="navbar"><div id="site-nav"></div></nav>

<div class="admin-shell">
  <aside class="admin-side">
    <a href="admin.html">Dashboard</a>
    <a href="admin-bookings.html">Bookings</a>
    <a href="admin-menu.html" class="active">Menu Items</a>
  </aside>
  <main class="admin-main">
    <div class="section-head">
      <p class="eyebrow">Admin</p>
      <h2>Menu Items</h2>
    </div>

    <form id="add-form" class="form-panel wide" style="margin:0 0 40px;">
      <div id="msg" class="form-msg"></div>
      <div class="field-row">
        <div class="field">
          <label for="name">Item name</label>
          <input type="text" id="name" required />
        </div>
        <div class="field">
          <label for="category">Category</label>
          <input type="text" id="category" placeholder="Coffee, Pastry, Food…" required />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="price">Price</label>
          <input type="number" id="price" step="0.01" min="0" required />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" />
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Add Item</button>
    </form>

    <div id="menu-list" class="loader">Loading…</div>
  </main>
</div>

<script type="module">
  import { renderLayout } from "./js/layout.js";
  import { requireAdmin } from "./js/auth.js";
  import { getMenuItems, addMenuItem, deleteMenuItem } from "./js/menu.js";

  renderLayout("admin-menu.html");
  requireAdmin();

  const form = document.getElementById("add-form");
  const msg = document.getElementById("msg");

  async function load() {
    const list = document.getElementById("menu-list");
    const items = await getMenuItems();

    if (!items.length) {
      list.innerHTML = `<div class="empty-state"><h3>No menu items yet</h3><p>Add your first item above.</p></div>`;
      return;
    }

    list.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Description</th><th></th></tr></thead>
          <tbody>
            ${items.map(i => `
              <tr>
                <td>${i.name}</td>
                <td>${i.category}</td>
                <td>$${i.price}</td>
                <td>${i.description || "—"}</td>
                <td><button class="btn-danger" data-del="${i.id}">Delete</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;

    list.querySelectorAll("[data-del]").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("Delete this item?")) return;
        await deleteMenuItem(btn.dataset.del);
        load();
      };
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "form-msg";
    try {
      await addMenuItem({
        name: document.getElementById("name").value,
        category: document.getElementById("category").value,
        price: document.getElementById("price").value,
        description: document.getElementById("description").value,
      });
      msg.textContent = "Item added.";
      msg.className = "form-msg success show";
      form.reset();
      load();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = "form-msg error show";
    }
  });

  document.addEventListener("authready", (e) => {
    if (e.detail.user && e.detail.profile?.isAdmin) load();
  });
</script>
</body>
</html>
