<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings — Crush Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=Space+Mono&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <nav class="navbar">
    <div id="site-nav"></div>
  </nav>

  <header class="hero" style="padding:70px 0;">
    <div class="wrap">
      <p class="eyebrow" data-user-name></p>
      <h1 style="font-size:clamp(2.2rem,4vw,3.2rem);">My Bookings</h1>
    </div>
  </header>

  <section>
    <div class="wrap">
      <div id="bookings-list" class="loader">Loading your bookings…</div>
    </div>
  </section>

  <footer>
    <div id="site-footer"></div>
  </footer>

  <script type="module">
    import { renderLayout } from "./js/layout.js";
    import { requireAuth } from "./js/auth.js";
    import { getUserBookings, deleteBooking } from "./js/booking.js";

    renderLayout("my-bookings.html");
    requireAuth();

    async function load(uid) {
      const list = document.getElementById("bookings-list");
      const bookings = await getUserBookings(uid);

      if (!bookings.length) {
        list.innerHTML = `<div class="empty-state"><h3>No bookings yet</h3><p>Book a table or a celebration package to see it here.</p></div>`;
        return;
      }

      list.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Type</th><th>Date</th><th>Time</th><th>Guests</th><th>Details</th><th></th></tr>
          </thead>
          <tbody>
            ${bookings.map(b => `
              <tr data-id="${b.id}">
                <td><span class="badge ${b.type}">${b.type}</span></td>
                <td>${b.date}</td>
                <td>${b.time}</td>
                <td>${b.guests}</td>
                <td>${b.packageName || b.notes || "—"}</td>
                <td><button class="btn-danger" data-cancel="${b.id}">Cancel</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;

      list.querySelectorAll("[data-cancel]").forEach(btn => {
        btn.onclick = async () => {
          if (!confirm("Cancel this booking?")) return;
          await deleteBooking(btn.dataset.cancel);
          load(uid);
        };
      });
    }

    document.addEventListener("authready", (e) => {
      if (e.detail.user) load(e.detail.user.uid);
    });
  </script>
</body>

</html>
