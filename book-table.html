<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book a Table — Crush Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav class="navbar"><div id="site-nav"></div></nav>

<section style="padding-top:60px;">
  <div class="wrap">
    <div class="section-head center" style="margin:0 auto 40px;">
      <p class="eyebrow">Reserve ahead</p>
      <h2>Book a Table</h2>
      <p>Tables hold for 15 minutes past the reserved time.</p>
    </div>

    <div id="guest-notice" class="form-panel center hidden">
      <p>You'll need an account to book a table.</p>
      <a href="login.html" class="btn btn-primary mt-40">Log In or Sign Up</a>
    </div>

    <form id="booking-form" class="form-panel hidden">
      <div id="msg" class="form-msg"></div>
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="time">Time</label>
          <input type="time" id="time" required />
        </div>
        <div class="field">
          <label for="guests">Guests</label>
          <input type="number" id="guests" min="1" max="12" value="2" required />
        </div>
      </div>
      <div class="field">
        <label for="notes">Notes (optional)</label>
        <textarea id="notes" rows="3" placeholder="Window seat, high chair needed, etc."></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Confirm Booking</button>
    </form>
  </div>
</section>

<footer><div id="site-footer"></div></footer>

<script type="module">
  import { renderLayout } from "./js/layout.js";
  import { requireAuth } from "./js/auth.js";
  import { createBooking } from "./js/booking.js";

  renderLayout("book-table.html");

  let currentUser = null;
  document.addEventListener("authready", (e) => {
    currentUser = e.detail.user;
    document.getElementById("guest-notice").classList.toggle("hidden", !!currentUser);
    document.getElementById("booking-form").classList.toggle("hidden", !currentUser);
  });

  const form = document.getElementById("booking-form");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!currentUser) return;
    msg.className = "form-msg";

    try {
      await createBooking({
        userId: currentUser.uid,
        userEmail: currentUser.email,
        type: "table",
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        guests: Number(document.getElementById("guests").value),
        notes: document.getElementById("notes").value,
      });
      msg.textContent = "Table booked — see it under My Bookings.";
      msg.className = "form-msg success show";
      form.reset();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = "form-msg error show";
    }
  });
</script>
</body>
</html>
