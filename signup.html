<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — Crush Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--smoke); font-size:0.82rem; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--line-dark); }
  .btn-google {
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:12px 20px; border:1px solid var(--line-dark); border-radius:var(--radius);
    background:#fff; font-size:0.92rem; font-weight:600; color:var(--espresso-deep);
    cursor:pointer; transition:box-shadow 0.2s, border-color 0.2s; font-family:var(--font-body);
  }
  .btn-google:hover { box-shadow:0 2px 8px rgba(0,0,0,0.12); border-color:#4285F4; }
  .btn-google svg { flex-shrink:0; }
</style>
</head>
<body>
<nav class="navbar"><div id="site-nav"></div></nav>

<section style="padding-top:80px;">
  <div class="wrap">
    <form id="signup-form" class="form-panel">
      <div class="section-head center" style="margin:0 auto 30px;">
        <p class="eyebrow">Join us</p>
        <h2>Create an Account</h2>
      </div>
      <div id="msg" class="form-msg"></div>

      <!-- Google Sign-Up -->
      <button type="button" id="google-btn" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Sign up with Google
      </button>

      <div class="divider">or sign up with email</div>

      <div class="field">
        <label for="name">Your Name</label>
        <input type="text" id="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" minlength="6" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </div>
</section>

<footer><div id="site-footer"></div></footer>

<script type="module">
  import { renderLayout } from "./js/layout.js";
  import { signUp, signInWithGoogle } from "./js/auth.js";

  renderLayout("signup.html");

  const form = document.getElementById("signup-form");
  const msg  = document.getElementById("msg");

  // Email/password sign up
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "form-msg";
    try {
      await signUp(
        document.getElementById("name").value,
        document.getElementById("email").value,
        document.getElementById("password").value
      );
      window.location.href = "index.html";
    } catch (err) {
      msg.textContent = err.message;
      msg.className = "form-msg error show";
    }
  });

  // Google sign up
  document.getElementById("google-btn").addEventListener("click", async () => {
    msg.className = "form-msg";
    try {
      await signInWithGoogle();
      window.location.href = "index.html";
    } catch (err) {
      if (err.code !== "auth/popup-closed-by-user") {
        msg.textContent = err.message;
        msg.className = "form-msg error show";
      }
    }
  });
</script>
</body>
</html>
